<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Question ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e5, #fff0f5);
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            width: 90%;
        }

        .heart {
            font-size: 70px;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        h1 {
            font-size: 30px;
            color: #333;
            margin-bottom: 35px;
        }

        button {
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #yes {
            background: #ff4d79;
            color: white;
            transition: transform 0.2s;
        }

        #yes:hover {
            transform: scale(1.1);
        }

        #no {
            background: #555;
            color: white;
            position: fixed;
            transition: left 0.25s ease, top 0.25s ease;
        }

        #message {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #ff4d79;
        }

        .heart-float {
            position: fixed;
            bottom: -20px;
            font-size: 25px;
            animation: floatUp 4s linear forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Will you say YES? 🥺</h1>

        <button id="yes" onclick="yesClicked()">YES ❤️</button>

        <button id="no">NO 😭</button>

        <div id="message"></div>

    </div>

    <script>
        const noButton = document.getElementById("no");

        let attempts = 0;

        const messages = [
            "Nice try 😂",
            "Nope 😭",
            "You can't catch me!",
            "Why are you trying to press NO? 😭",
            "JUST SAY YES ❤️",
            "Bro... seriously? 😂"
        ];

        function moveNoButton() {

            attempts++;

            const maxX = window.innerWidth - noButton.offsetWidth - 10;
            const maxY = window.innerHeight - noButton.offsetHeight - 10;

            const x = Math.random() * maxX + 5;
            const y = Math.random() * maxY + 5;

            noButton.style.left = x + "px";
            noButton.style.top = y + "px";

            document.getElementById("message").innerText =
                messages[Math.min(attempts - 1, messages.length - 1)];
        }

        // Computer
        noButton.addEventListener("mouseenter", moveNoButton);

        // Phone
        noButton.addEventListener("touchstart", function(event) {
            event.preventDefault();
            moveNoButton();
        });

        function yesClicked() {

            document.querySelector(".container").innerHTML = `
                <div class="heart">💖</div>
                <h1>YAAAAAY!!! 🥰❤️</h1>
                <p style="font-size:24px;">I knew you'd say YES! 😭❤️</p>
            `;

            for (let i = 0; i < 25; i++) {
                createHeart();
            }
        }

        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "heart-float";
            heart.innerText = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (2 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }
    </script>

</body>
</html>
