<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Question ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ffd6e5, #fff0f5);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 90%;
        }

        .heart {
            font-size: 75px;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        h1 {
            color: #333;
            font-size: 30px;
            margin-bottom: 35px;
        }

        #buttons {
            position: relative;
            height: 100px;
        }

        button {
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #yes {
            background: #ff4d79;
            color: white;
            transition: transform 0.25s ease;
        }

        #no {
            background: #555;
            color: white;
            position: fixed;
            transition: left 0.18s ease, top 0.18s ease, transform 0.18s ease;
            z-index: 10;
        }

        #message {
            margin-top: 25px;
            min-height: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #ff4d79;
        }

        .floating-heart {
            position: fixed;
            bottom: -30px;
            pointer-events: none;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .confetti {
            position: fixed;
            top: -20px;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="main">

        <div class="heart">❤️</div>

        <h1>Will you say YES? 🥺</h1>

        <div id="buttons">
            <button id="yes" onclick="yesClicked()">YES ❤️</button>
        </div>

        <div id="message"></div>

    </div>

    <button id="no">NO 😭</button>

    <script>

        const noButton = document.getElementById("no");
        const yesButton = document.getElementById("yes");
        const message = document.getElementById("message");

        let attempts = 0;

        const messages = [
            "Nice try 😂",
            "Nope 😭",
            "You can't catch me!",
            "Why are you trying to press NO? 😭",
            "JUST SAY YES ❤️",
            "Bro... give up 😂",
            "The NO button has left the chat 💀",
            "You're still trying?! 😭",
            "JUST. PRESS. YES. ❤️"
        ];

        // Put NO somewhere random when the page starts
        moveNoButton();

        function moveNoButton() {

            attempts++;

            const padding = 15;

            const maxX =
                window.innerWidth -
                noButton.offsetWidth -
                padding;

            const maxY =
                window.innerHeight -
                noButton.offsetHeight -
                padding;

            const x =
                Math.random() * (maxX - padding) + padding;

            const y =
                Math.random() * (maxY - padding) + padding;

            noButton.style.left = x + "px";
            noButton.style.top = y + "px";

            // Make YES progressively bigger
            yesButton.style.transform =
                `scale(${1 + attempts * 0.05})`;

            message.innerText =
                messages[Math.min(
                    attempts - 1,
                    messages.length - 1
                )];
        }

        // Desktop: escape when mouse gets close
        document.addEventListener("mousemove", function(event) {

            const rect = noButton.getBoundingClientRect();

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const distance = Math.sqrt(
                Math.pow(event.clientX - centerX, 2) +
                Math.pow(event.clientY - centerY, 2)
            );

            if (distance < 100) {
                moveNoButton();
            }

        });

        // Phone: escape when finger touches / gets close
        document.addEventListener("touchstart", function(event) {

            const touch = event.touches[0];

            const rect = noButton.getBoundingClientRect();

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const distance = Math.sqrt(
                Math.pow(touch.clientX - centerX, 2) +
                Math.pow(touch.clientY - centerY, 2)
            );

            if (distance < 120) {
                event.preventDefault();
                moveNoButton();
            }

        }, { passive: false });


        function yesClicked() {

            document.getElementById("main").innerHTML = `
                <div class="heart">💖</div>

                <h1>
                    YAAAAAY!!! 🥰❤️
                </h1>

                <p style="font-size:24px;">
                    I knew you'd say YES! 😭❤️
                </p>
            `;

            noButton.remove();

            createHearts();
            createConfetti();
        }


        function createHearts() {

            for (let i = 0; i < 40; i++) {

                const heart =
                    document.createElement("div");

                heart.className = "floating-heart";

                heart.innerText =
                    ["❤️", "💕", "💖", "💗", "💓"]
                    [Math.floor(Math.random() * 5)];

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.fontSize =
                    (20 + Math.random() * 30) + "px";

                heart.style.animationDuration =
                    (2 + Math.random() * 4) + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }
        }


        function createConfetti() {

            for (let i = 0; i < 80; i++) {

                const piece =
                    document.createElement("div");

                piece.className = "confetti";

                piece.innerText =
                    ["🎉", "✨", "💖", "🥳"]
                    [Math.floor(Math.random() * 4)];

                piece.style.left =
                    Math.random() * 100 + "vw";

                piece.style.fontSize =
                    (15 + Math.random() * 20) + "px";

                piece.style.animationDuration =
                    (2 + Math.random() * 3) + "s";

                document.body.appendChild(piece);

                setTimeout(() => {
                    piece.remove();
                }, 6000);
            }
        }

    </script>

</body>
</html>
