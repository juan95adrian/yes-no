<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrian Matovu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ffd6e5, #fff0f5);
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 90%;
        }

        .heart {
            font-size: 75px;
            animation: heartbeat 1s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        h1 {
            color: #333;
            font-size: 30px;
            margin-bottom: 35px;
        }

        #buttons {
            height: 100px;
        }

        button {
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* YES */

        #yes {
            background: #ff4d79;
            color: white;
        }

        #yes.vibrate {
            animation: vibrate 0.25s;
        }

        @keyframes vibrate {
            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-5px);
            }

            40% {
                transform: translateX(5px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* NO */

        #no {
            background: #555;
            color: white;

            position: fixed;

            transition:
                left 0.18s ease,
                top 0.18s ease;
            
            z-index: 10;
        }

        /* COMMENTARY */

        #message {
            margin-top: 25px;
            min-height: 65px;

            font-size: 20px;
            font-weight: bold;

            color: #ff4d79;

            line-height: 1.4;
        }

        /* HEARTS */

        .floating-heart {
            position: fixed;
            bottom: -30px;

            pointer-events: none;

            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* CONFETTI */

        .confetti {
            position: fixed;
            top: -20px;

            pointer-events: none;

            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }
    </style>
</head>


<body>


    <div class="container" id="main">

        <div class="heart">
            ❤️
        </div>

        <h1>
            Are you GAY? 🥺
        </h1>

        <div id="buttons">

            <button
                id="yes"
                onclick="yesClicked()">

                YES ❤️

            </button>

        </div>

        <div id="message"></div>

    </div>


    <button id="no">
        NO 😭
    </button>



    <script>

        const noButton =
            document.getElementById("no");

        const yesButton =
            document.getElementById("yes");

        const message =
            document.getElementById("message");


        let attempts = 0;



        /*
        40 DIFFERENT COMMENTS
        */

        const messages = [

            "Nice try 😂",

            "Wait... you actually chose NO? 😭",

            "Why are you chasing me? 💀",

            "You're not catching me 😂",

            "Please reconsider your decision 😭❤️",

            "The YES button is right there 👀",

            "I'm getting tired of running 😭",

            "BRO JUST SAY YES 😂",

            "Okay this is getting embarrassing 💀",

            "YOU STILL WANT NO?! 😭",

            "At this point you're doing this on purpose 😂",

            "Just press YES already ❤️",

            "Why are you fighting destiny? 😭",

            "You know the NO button isn't going to cooperate, right? 😂",

            "I'm literally running away from you 💀",

            "PLEASE 😭❤️",

            "This is your sign to press YES 👀",

            "Okay... I'm warning you 😂",

            "YOU CANNOT CATCH ME 🏃💨",

            "Just. Say. YES. ❤️",

            "Why are you like this? 😭",

            "I'm starting to think you enjoy chasing me 😂",

            "NO is currently unavailable 💀",

            "The button said NO to you saying NO 😂",

            "Bro I'm RIGHT HERE... SIKE 😭",

            "You almost had me! 😂",

            "That was close 👀",

            "Nahhhh I'm too fast 🏃💨",

            "Give up already 😭",

            "I have places to be 💀",

            "You're really committed to this NO thing huh? 😂",

            "The YES button is looking lonely 🥺",

            "I'm protecting your future 😂❤️",

            "NO has officially entered witness protection 💀",

            "You can't escape the YES 😭",

            "How many times are you going to try? 😂",

            "I'm not even sorry anymore 💀",

            "Okay this is getting personal 😂",

            "PLEASE JUST PRESS YES 😭❤️",

            "Fine. Chase me forever then 😂"

        ];



        /*
        MOVE NO BUTTON
        */

        function moveNoButton() {

            attempts++;


            const padding = 15;


            const maxX =
                window.innerWidth -
                noButton.offsetWidth -
                padding;


            const maxY =
                window.innerHeight -
                noButton.offsetHeight -
                padding;


            const x =
                Math.random() *
                (maxX - padding)
                + padding;


            const y =
                Math.random() *
                (maxY - padding)
                + padding;


            noButton.style.left =
                x + "px";


            noButton.style.top =
                y + "px";



            /*
            VIBRATE YES
            */

            yesButton.classList.remove(
                "vibrate"
            );


            void yesButton.offsetWidth;


            yesButton.classList.add(
                "vibrate"
            );



            /*
            CHANGE COMMENT

            % makes the comments
            repeat forever.
            */

            message.innerText =
                messages[
                    (attempts - 1)
                    % messages.length
                ];

        }



        /*
        START NO BUTTON
        */

        moveNoButton();



        /*
        COMPUTER

        Run away when mouse
        gets close.
        */

        document.addEventListener(
            "mousemove",
            function(event) {

                const rect =
                    noButton.getBoundingClientRect();


                const centerX =
                    rect.left +
                    rect.width / 2;


                const centerY =
                    rect.top +
                    rect.height / 2;


                const distance =
                    Math.sqrt(

                        Math.pow(
                            event.clientX -
                            centerX,
                            2
                        )

                        +

                        Math.pow(
                            event.clientY -
                            centerY,
                            2
                        )

                    );


                if (distance < 100) {

                    moveNoButton();

                }

            }
        );



        /*
        PHONE

        Run away when finger
        gets close.
        */

        document.addEventListener(
            "touchstart",
            function(event) {

                const touch =
                    event.touches[0];


                const rect =
                    noButton.getBoundingClientRect();


                const centerX =
                    rect.left +
                    rect.width / 2;


                const centerY =
                    rect.top +
                    rect.height / 2;


                const distance =
                    Math.sqrt(

                        Math.pow(
                            touch.clientX -
                            centerX,
                            2
                        )

                        +

                        Math.pow(
                            touch.clientY -
                            centerY,
                            2
                        )

                    );


                if (distance < 140) {

                    event.preventDefault();

                    moveNoButton();

                }

            },

            {
                passive: false
            }
        );



        /*
        YES BUTTON
        */

        function yesClicked() {

            document.getElementById(
                "main"
            ).innerHTML = `

                <div class="heart">
                    💖
                </div>

                <h1>
                    IT'S OKAY BRO I ALREADY KNEW
                </h1>

                <p style="
                    font-size:24px;
                    font-weight:bold;
                ">
                    ATLEAST YOU'RE NOT AN ARSENAL FAN THAT'S DOUBLE GAY
                </p>

            `;


            /*
            REMOVE NO
            */

            noButton.remove();



            /*
            CELEBRATION
            */

            createHearts();

            createConfetti();

        }



        /*
        FLOATING HEARTS
        */

        function createHearts() {

            for (
                let i = 0;
                i < 40;
                i++
            ) {

                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "floating-heart";


                heart.innerText =
                    [
                        "❤️",
                        "💕",
                        "💖",
                        "💗",
                        "💓"
                    ][
                        Math.floor(
                            Math.random() * 5
                        )
                    ];


                heart.style.left =
                    Math.random() * 100
                    + "vw";


                heart.style.fontSize =
                    (
                        20 +
                        Math.random() * 30
                    )
                    + "px";


                heart.style.animationDuration =
                    (
                        2 +
                        Math.random() * 4
                    )
                    + "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    () => {
                        heart.remove();
                    },
                    6000
                );

            }

        }



        /*
        CONFETTI
        */

        function createConfetti() {

            for (
                let i = 0;
                i < 80;
                i++
            ) {

                const piece =
                    document.createElement(
                        "div"
                    );


                piece.className =
                    "confetti";


                piece.innerText =
                    [
                        "🎉",
                        "✨",
                        "💖",
                        "🥳"
                    ][
                        Math.floor(
                            Math.random() * 4
                        )
                    ];


                piece.style.left =
                    Math.random() * 100
                    + "vw";


                piece.style.fontSize =
                    (
                        15 +
                        Math.random() * 20
                    )
                    + "px";


                piece.style.animationDuration =
                    (
                        2 +
                        Math.random() * 3
                    )
                    + "s";


                document.body.appendChild(
                    piece
                );


                setTimeout(
                    () => {
                        piece.remove();
                    },
                    6000
                );

            }

        }

    </script>

</body>
</html>
